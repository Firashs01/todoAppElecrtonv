<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FocusFlow Notes — freeform notes workspace with task tagging and note-to-task promotion.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'">
  <title>Notes — FocusFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="header-inner container">
      <div class="brand">
        <a href="index.html" class="brand-link" title="Return to tasks">
          <div class="brand-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 11 12 14 22 4"></polyline>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="brand-title">FocusFlow</h1>
            <span class="brand-subtitle">Notes Workspace</span>
          </div>
        </a>
      </div>

      <div class="header-actions">
        <a href="stats.html" class="btn-secondary btn-compact" id="statsNavBtn" title="Productivity statistics & time tracking">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span class="btn-text">Stats</span>
        </a>

        <button id="themeToggleBtn" class="btn-icon" aria-label="Toggle dark mode" title="Toggle theme (Light / Dark)">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <a href="index.html" class="btn-secondary btn-compact" id="backToTasksBtn" title="Return to task list">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span class="btn-text">Back to Tasks</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="container main-layout">
    <!-- Notes Toolbar: Search & Create -->
    <section class="notes-toolbar-section" aria-label="Notes toolbar">
      <div class="notes-toolbar-row">
        <div class="search-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            type="search"
            id="notesSearchInput"
            class="search-input"
            placeholder="Search notes..."
            aria-label="Search notes"
          >
          <button id="clearNotesSearchBtn" class="clear-search-btn" aria-label="Clear search" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <button id="createNoteBtn" class="btn-primary" title="Create a new note">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New Note</span>
        </button>
      </div>
      <div class="notes-count-bar">
        <span id="notesCountLabel" class="list-status-text">0 notes</span>
      </div>
    </section>

    <!-- Notes Grid -->
    <section class="notes-grid-section" aria-live="polite">
      <div id="notesGrid" class="notes-grid"></div>

      <!-- Empty State -->
      <div id="notesEmptyState" class="empty-state" hidden>
        <div class="empty-icon-wrapper" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
        </div>
        <h3 class="empty-title" id="notesEmptyTitle">No notes yet</h3>
        <p class="empty-desc" id="notesEmptyDesc">Create your first note to capture ideas, tag tasks, and promote notes into your Todo list.</p>
      </div>
    </section>

    <!-- Note Editor Modal (inline overlay) -->
    <div id="noteEditorOverlay" class="note-editor-overlay" hidden>
      <div class="note-editor-panel">
        <div class="note-editor-header">
          <h2 class="note-editor-heading" id="noteEditorHeading">New Note</h2>
          <button id="closeEditorBtn" class="btn-icon" aria-label="Close editor" title="Close editor">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="note-editor-body">
          <div class="note-field-group">
            <label for="noteTitleInput" class="meta-label">Title</label>
            <input type="text" id="noteTitleInput" class="task-input note-title-input" placeholder="Note title…" maxlength="200" required>
          </div>

          <div class="note-field-group">
            <label for="noteBodyInput" class="meta-label">Content</label>
            <textarea id="noteBodyInput" class="note-card-textarea note-body-textarea" placeholder="Write your note here…" rows="8"></textarea>
          </div>

          <!-- Task Tagging -->
          <div class="note-field-group">
            <label class="meta-label">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line>
              </svg>
              <span>Tag Tasks</span>
            </label>
            <div class="task-tag-selector">
              <select id="taskTagSelect" class="meta-select task-tag-dropdown">
                <option value="">— Select a task to tag —</option>
              </select>
              <button id="addTaskTagBtn" class="btn-secondary btn-compact" type="button" title="Tag selected task">+ Tag</button>
            </div>
            <div id="taggedTasksList" class="tagged-tasks-list"></div>
          </div>

          <!-- Promotion Status -->
          <div id="promotionStatusSection" class="note-promotion-section" hidden>
            <div class="promotion-badge-row">
              <span class="badge badge-promoted" id="promotionBadge">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="9 11 12 14 22 4"></polyline>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <span id="promotionBadgeText">In Todo Table</span>
              </span>
            </div>
          </div>
        </div>

        <div class="note-editor-footer">
          <div class="note-editor-footer-left">
            <button id="promoteNoteBtn" class="btn-secondary btn-compact" type="button" title="Promote this note to a task in the Todo table">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="17 11 12 6 7 11"></polyline>
                <polyline points="17 18 12 13 7 18"></polyline>
              </svg>
              <span>Start as Task</span>
            </button>
            <button id="deleteNoteBtn" class="btn-ghost-danger btn-compact" type="button" title="Delete this note">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              <span>Delete</span>
            </button>
          </div>
          <button id="saveNoteBtn" class="btn-primary btn-save" type="button">
            <svg class="btn-save-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Save Note</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer container">
    <p class="footer-text">
      FocusFlow • Notes Workspace • Built with semantic HTML5, CSS3, & Vanilla JS
    </p>
  </footer>

  <!-- Toast Notification System -->
  <div id="toastContainer" class="toast-container" role="status" aria-live="assertive"></div>

  <!-- Scripts -->
  <script src="storage.js"></script>
  <script src="notes.js"></script>
</body>
</html>
